services:
  # ==================== BASE DE DATOS POSTGRESQL ====================
  db:
    image: postgres:15-alpine
    container_name: taller_el_olam_db
    restart: always
    environment:
      POSTGRES_USER: taller_user
      POSTGRES_PASSWORD: taller_password
      POSTGRES_DB: taller_el_olam
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - taller_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taller_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== BACKEND (FLASK CON TEMPLATES) ====================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: taller_el_olam_backend
    restart: always
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://taller_user:taller_password@db:5432/taller_el_olam
      - SECRET_KEY=${SECRET_KEY:-produccion-secret-key-change-this}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-produccion-jwt-secret-key-change-this}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,http://localhost:80}
      - EMPRESA_NIT=${EMPRESA_NIT:-1065619550}
      - EMPRESA_DV=${EMPRESA_DV:-5}
      - EMPRESA_RAZON_SOCIAL=${EMPRESA_RAZON_SOCIAL:-MOTOTALLER EL OLAM}
      - EMPRESA_NOMBRE_COMERCIAL=${EMPRESA_NOMBRE_COMERCIAL:-MOTOTALLER EL OLAM}
      - EMPRESA_DIRECCION=${EMPRESA_DIRECCION:-CR 26 13 52 BRR ENEAL}
      - EMPRESA_CIUDAD=${EMPRESA_CIUDAD:-Valledupar}
      - EMPRESA_DEPARTAMENTO=${EMPRESA_DEPARTAMENTO:-Cesar}
      - EMPRESA_TELEFONO=${EMPRESA_TELEFONO:-3154541158}
      - EMPRESA_EMAIL=${EMPRESA_EMAIL:-matecari10@hotmail.com}
      - DIAN_SOFTWARE_ID=${DIAN_SOFTWARE_ID:-TallerElOlam}
      - DIAN_SOFTWARE_PIN=${DIAN_SOFTWARE_PIN:-123456}
      - DIAN_TESTING_MODE=${DIAN_TESTING_MODE:-true}
      - IVA_PORCENTAJE=${IVA_PORCENTAJE:-19}
      - PDF_FOLDER_PATH=${PDF_FOLDER_PATH:-facturas_pdf}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backend_facturas:/app/facturas_pdf
      - backend_xml:/app/facturas_electronicas
      - backend_uploads:/app/uploads
    networks:
      - taller_network

# ==================== VOLÚMENES ====================
volumes:
  postgres_data:
    driver: local
  backend_facturas:
    driver: local
  backend_xml:
    driver: local
  backend_uploads:
    driver: local

# ==================== REDES ====================
networks:
  taller_network:
    driver: bridge